<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Experimental Design &amp; Statistical Power</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/activity-shell.css">
<link rel="stylesheet" href="../../css/components.css">
<style>
  .ed-layout { display: grid; grid-template-columns: 19rem 1fr; gap: var(--space-6); align-items: start; }
  @media (max-width: 950px) { .ed-layout { grid-template-columns: 1fr; } }
  .ed-charts { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-5); }
  @media (max-width: 1200px) { .ed-charts { grid-template-columns: 1fr; } }
  .ed-summary-row { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
  .ed-summary-tile { background: var(--color-bg-alt); border-radius: var(--radius); padding: var(--space-3) var(--space-4); min-width: 8rem; }
  .ed-summary-tile__label { font-size: var(--font-size-sm); color: var(--color-text-muted); display: block; }
  .ed-summary-tile__value { font-size: var(--font-size-lg); font-weight: 700; }
</style>
</head>
<body>
<div id="activity-root"></div>

<script src="../../js/prng.js"></script>
<script src="../../js/math-utils.js"></script>
<script src="../../js/stats-utils.js"></script>
<script src="../../js/svg-utils.js"></script>
<script src="../../js/mode-manager.js"></script>
<script src="../../js/embed-bridge.js"></script>
<script src="../../js/content-notice.js"></script>
<script src="../../js/activity-shell.js"></script>
<script src="./experimental-design.js"></script>
</body>
</html>
