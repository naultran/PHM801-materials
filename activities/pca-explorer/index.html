<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PCA / Dimensionality Reduction Explorer</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/activity-shell.css">
<link rel="stylesheet" href="../../css/components.css">
<style>
  .pca-layout { display: grid; grid-template-columns: 18rem 1fr 16rem; gap: var(--space-6); align-items: start; }
  @media (max-width: 1200px) { .pca-layout { grid-template-columns: 1fr; } }
  .pca-checklist { max-height: 14rem; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
  .pca-checklist label { display: flex; align-items: center; gap: 6px; font-size: var(--font-size-sm); }
  .pca-legend { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-top: var(--space-2); font-size: var(--font-size-sm); }
  .pca-legend-item { display: flex; align-items: center; gap: 4px; }
  .pca-legend-swatch { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
  .pca-loadings-row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: 4px; font-size: var(--font-size-sm); }
  .pca-loadings-row__label { width: 7rem; flex-shrink: 0; text-align: right; }
  .pca-loadings-row__bar-wrap { flex: 1; display: flex; }
  .pca-loadings-row__bar { height: 14px; }
</style>
</head>
<body>
<div id="activity-root"></div>

<script src="../../js/prng.js"></script>
<script src="../../js/math-utils.js"></script>
<script src="../../js/pca.js"></script>
<script src="../../js/svg-utils.js"></script>
<script src="../../js/mode-manager.js"></script>
<script src="../../js/embed-bridge.js"></script>
<script src="../../js/content-notice.js"></script>
<script src="../../js/text-to-speech.js"></script>
<script src="../../js/activity-shell.js"></script>
<script src="./pca-explorer.js"></script>
</body>
</html>
