project:
  type: website
  output-dir: _site
  # activities/, data/, js/, css/, assets/ are plain static files (not Quarto
  # source docs). Listing them here guarantees they are copied verbatim into
  # _site/ even though nothing in them is auto-discoverable by Quarto's HTML
  # cross-reference scanner (e.g. JSON files loaded via fetch() from inside a
  # .js file are invisible to that scanner).
  resources:
    - "activities/**"
    - "data/**"
    - "js/**"
    - "css/**"
    - "assets/**"
    - "robots.txt"
  # Instructor/maintainer documentation is intentionally kept OUT of the
  # published GitHub Pages site — it's meant to be read as plain Markdown in
  # the repository (GitHub renders it natively), not as a page students land
  # on. Excluding it here means the live site is only ever course content.
  render:
    - "*.qmd"
    - "lectures/*.qmd"
    # The blank lecture template is for copying, not for students to land on.
    - "!lectures/lecture-02-template.qmd"
    - "!README.md"
    - "!INTERACTIVITY-GUIDE.md"
    - "!TECHNICAL-LIMITS.md"

website:
  title: "PHM801 Systems Pharmacology"
  description: "Interactive lectures and activities on systems pharmacology: transcriptomic, single-cell, and spatial approaches to understanding drug action and safety."
  site-url: "https://naultran.github.io/interactive-lecture-test/"
  favicon: assets/favicon.svg
  navbar:
    background: "#18453b"
    foreground: "#ffffff"
    left:
      - href: index.qmd
        text: Home
      - href: lectures/lecture-01-systems-pharm.qmd
        text: "Lecture 1: Transcriptomics"
      - href: lectures/lecture-02-transcriptomics.qmd
        text: "Lecture 2: Single-Cell & Spatial"
      - href: index.qmd#activities
        text: Activities
  page-footer:
    center: "PHM801 · Michigan State University · © 2026 Rance Nault. All rights reserved."

format:
  # Unlisted: every page carries a noindex tag (see _includes/noindex.html; lectures and
  # activity pages add it themselves) and robots.txt asks crawlers to stay out.
  html:
    include-in-header: _includes/noindex.html
    theme: cosmo
    css: [css/variables.css, css/base.css, css/home.css]
    toc: false
    grid:
      body-width: 900px
    link-external-newwindow: true

execute:
  freeze: auto
