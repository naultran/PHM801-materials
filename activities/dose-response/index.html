<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dose-Response Laboratory</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/activity-shell.css">
<link rel="stylesheet" href="../../css/components.css">
<style>
  .dr-layout { display: grid; grid-template-columns: 20rem 1fr; gap: var(--space-6); align-items: start; }
  @media (max-width: 950px) { .dr-layout { grid-template-columns: 1fr; } }
  .dr-chart-wrap { overflow-x: auto; }
  .dr-readouts { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-3); }
  .dr-readout-tile { background: var(--color-bg-alt); border-radius: var(--radius); padding: var(--space-3) var(--space-4); }
  .dr-readout-tile__label { font-size: var(--font-size-sm); color: var(--color-text-muted); display: block; }
  .dr-readout-tile__value { font-size: var(--font-size-lg); font-weight: 700; }
</style>
</head>
<body>
<div id="activity-root"></div>

<script src="../../js/prng.js"></script>
<script src="../../js/math-utils.js"></script>
<script src="../../js/dose-response-model.js"></script>
<script src="../../js/svg-utils.js"></script>
<script src="../../js/mode-manager.js"></script>
<script src="../../js/embed-bridge.js"></script>
<script src="../../js/content-notice.js"></script>
<script src="../../js/activity-shell.js"></script>
<script src="./dose-response.js"></script>
</body>
</html>
