<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
<title>Bulk-Tissue Mixture Simulator</title>
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/base.css">
<link rel="stylesheet" href="../../css/activity-shell.css">
<link rel="stylesheet" href="../../css/components.css">
<style>
  .mx-layout { display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-6); align-items: start; }
  @media (max-width: 950px) { .mx-layout { grid-template-columns: 1fr; } }
  .mx-celltype { border: 1px solid var(--color-border); border-radius: var(--radius); padding: var(--space-3); margin-bottom: var(--space-3); }
  .mx-celltype h4 { margin: 0 0 var(--space-2); }
  .mx-bar-row { display: flex; align-items: center; gap: var(--space-3); margin-bottom: var(--space-2); }
  .mx-bar-row__label { width: 10rem; flex-shrink: 0; font-size: var(--font-size-sm); }
  .mx-bar-row__track { flex: 1; background: var(--color-bg-alt); border-radius: 4px; height: 20px; overflow: hidden; display: flex; }
  .mx-bar-row__fill { height: 100%; }
  .mx-bar-row__fill.series-a { background: var(--color-primary); }
  .mx-bar-row__fill.series-b { background: var(--color-accent); }
  .mx-bar-row__value { width: 4rem; text-align: right; font-variant-numeric: tabular-nums; font-size: var(--font-size-sm); }
  .mx-score-row { display: flex; gap: var(--space-4); margin: var(--space-3) 0; flex-wrap: wrap; }
  .mx-score-tile { background: var(--color-bg-alt); border-radius: var(--radius); padding: var(--space-3) var(--space-4); }
  .mx-score-tile__label { font-size: var(--font-size-sm); color: var(--color-text-muted); display:block; }
  .mx-score-tile__value { font-size: var(--font-size-lg); font-weight: 700; }
  .mx-preset-row { display: flex; gap: var(--space-3); flex-wrap: wrap; margin-bottom: var(--space-4); }
</style>
</head>
<body>
<div id="activity-root"></div>

<script src="../../js/prng.js"></script>
<script src="../../js/math-utils.js"></script>
<script src="../../js/similarity.js"></script>
<script src="../../js/mode-manager.js"></script>
<script src="../../js/embed-bridge.js"></script>
<script src="../../js/content-notice.js"></script>
<script src="../../js/text-to-speech.js"></script>
<script src="../../js/activity-shell.js"></script>
<script src="../../js/before-after-component.js"></script>
<script src="./mixture-simulator.js"></script>
</body>
</html>
